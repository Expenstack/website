name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Knip
        run: pnpm knip
